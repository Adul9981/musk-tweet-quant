<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musk Quant Radar · 完全免费开放</title>
    <meta name="description" content="免费开放的马斯克推文预测量化工具，实时追踪 Polymarket 推文数市场。" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --card: #fff;
        --ink: #1d1d1f;
        --sub: #6e6e73;
        --line: #e5e5ea;
        --accent: #0e9486;
        --accent-soft: #e8f6f3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .hero {
        padding: clamp(32px, 7vw, 72px);
        border-radius: 32px;
        background: linear-gradient(145deg, #fff 15%, #edf9f6 100%);
        border: 1px solid var(--line);
        box-shadow: 0 18px 60px rgba(29, 29, 31, 0.07);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        color: #08796e;
        background: var(--accent-soft);
        border: 1px solid #bfe7df;
        font-size: 13px;
        font-weight: 700;
      }
      h1 {
        max-width: 760px;
        margin: 24px 0 16px;
        font-size: clamp(38px, 7vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      .lead {
        max-width: 650px;
        margin: 0;
        color: var(--sub);
        font-size: clamp(17px, 2.2vw, 21px);
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }
      a {
        color: inherit;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
      .primary {
        color: #fff;
        background: var(--accent);
        box-shadow: 0 8px 22px rgba(14, 148, 134, 0.2);
      }
      .secondary {
        background: #fff;
        border: 1px solid var(--line);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      article {
        min-height: 185px;
        padding: 24px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      article span {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        margin-bottom: 18px;
        border-radius: 11px;
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 800;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      article p,
      footer {
        color: var(--sub);
        line-height: 1.65;
      }
      article p {
        margin: 0;
        font-size: 14px;
      }
      footer {
        padding: 28px 4px 0;
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 760px) {
        main { padding-top: 24px; }
        .hero { border-radius: 24px; }
        .grid { grid-template-columns: 1fr; }
        article { min-height: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <span class="pill">✓ 全部功能免费开放</span>
        <h1>马斯克推文市场，<br />把节奏变成数据。</h1>
        <p class="lead">
          实时追踪马斯克推文数量，分析 Polymarket 区间定价、发推节奏与价格形态。
          无需注册、无需订阅，直接打开即可使用全部功能。
        </p>
        <div class="actions">
          <a class="primary" href="https://musk-tweet-quant-rtmv.vercel.app/">立即免费使用</a>
          <a class="secondary" href="https://polymarket.com/event/elon-musk-of-tweets">查看 Polymarket 市场</a>
        </div>
      </section>

      <section class="grid" aria-label="工具功能">
        <article>
          <span>01</span>
          <h2>实时发推追踪</h2>
          <p>当前推文数、发推速度、剩余时间与各区间市场定价集中呈现。</p>
        </article>
        <article>

        <article>

        </article>
      </section>

      <footer>
        数据和模型仅供研究与信息参考，不构成投资建议。Polymarket 交易存在风险。
      </footer>
    </main>
  </body>
</html>
